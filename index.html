// ---- Animated word for scroll color ----
function LoungePhrase() {
  const tweaks = (typeof window !== 'undefined' && window.__tweaks) || {};
  const baseText = "lounge and hybrid wear that moves with your life, from home to errands, work to travel, without ever asking you to choose between comfort and style.";
  const text = tweaks.loungePhraseUppercase ? baseText.toUpperCase() : baseText;
  const words = text.split(" ");
  const ref = useRef(null);
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    function onScroll() {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const vh = window.innerHeight;
      const total = r.height + vh * 0.8;
      const traveled = vh - r.top;
      const p = Math.max(0, Math.min(1, traveled / total));
      setProgress(p);
    }
    onScroll();
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    return () => {window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll)};
  }, []);

  return (
    <section className="lounge-phrase" ref={ref}>
      <DecoVector className="v2" rot={-progress * 360} />
      <h2>
        {words.map((w,i) => {
          const wordP = i / words.length;
          const on = progress * 1.15 > wordP;
          return (
            <span key={i} className="w" style={{
              color: on ? 'var(--chocolate)' : 'var(--bone-2)'
            }}>{w}</span>
          );
        })}
      </h2>
    </section>
  );
}

// Rotating deco vectors that rotate on scroll — using the real Figma squiggly ring shapes
function ScrollVectors() {
  const [scrollY, setScrollY] = useState(0);
  useEffect(() => {
    const h = () => setScrollY(window.scrollY);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  // The vectors sit flanking the lounge phrase. Rotate them on scroll — one cw, one ccw.
  const rot = scrollY * 0.22;
  return (
    <>
      {/* Left-side squiggly ring — warm taupe, anticlockwise */}
      <div style={{ position: 'absolute', top: '-68px', left: '40px', width: 160, height: 80, pointerEvents: 'none',
        transform: `rotate(${-rot}deg)`, transformOrigin: '50% 50%', willChange: 'transform', opacity: 1,
        background: 'var(--warm-taupe)',
        WebkitMask: 'url(assets/Logo.svg) center / contain no-repeat',
        mask: 'url(assets/Logo.svg) center / contain no-repeat' }} />
      {/* Right-side squiggly ring — chocolate, clockwise */}
      <div style={{ position: 'absolute', bottom: '-40px', right: '5%', width: 210, height: 130, pointerEvents: 'none',
        transform: `rotate(${rot}deg)`, transformOrigin: '50% 50%', willChange: 'transform', opacity: 0.6,
        background: 'var(--chocolate)',
        WebkitMask: 'url(assets/Logo-striped.svg) center / contain no-repeat',
        mask: 'url(assets/Logo-striped.svg) center / contain no-repeat' }} />
    </>);

}

// ========== TWEAKS ==========
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "loungePhraseUppercase": true,
  "everyoneSectionHeight": 600,
  "accentOnSwirl": true
}/*EDITMODE-END*/;
window.__tweaks = { ...TWEAK_DEFAULTS };

function TweaksPanel() {
  const [on, setOn] = useState(false);
  const [state, setState] = useState({ ...window.__tweaks });

  useEffect(() => {
    function handler(e) {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setOn(true);
      if (e.data.type === '__deactivate_edit_mode') setOn(false);
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  function update(patch) {
    const next = { ...state, ...patch };
    setState(next);
    window.__tweaks = next;
    // trigger re-render of consumers + apply DOM side effects
    window.dispatchEvent(new Event('tweaks-changed'));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  }

  if (!on) return null;
  return (
    <div style={{
      position:'fixed', right:20, bottom:20, zIndex:9999,
      background:'#fff', border:'1px solid #E7E5E4', borderRadius:8,
      padding:'18px 20px', width:280, fontFamily:'Funnel Sans, sans-serif',
      boxShadow:'0 12px 40px rgba(0,0,0,0.14)', color:'#332925'
    }}>
      <div style={{fontFamily:'Funnel Display, serif', fontWeight:700, fontSize:16, marginBottom:14, letterSpacing:'-0.01em'}}>Tweaks</div>

      <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:13,marginBottom:14,cursor:'pointer'}}>
        <span>Uppercase lounge phrase</span>
        <input type="checkbox" checked={!!state.loungePhraseUppercase} onChange={e=>update({loungePhraseUppercase:e.target.checked})}/>
      </label>

      <label style={{display:'flex',flexDirection:'column',fontSize:13,marginBottom:14,gap:6}}>
        <span>"Everyone" section height: <b>{state.everyoneSectionHeight}px</b></span>
        <input type="range" min="349" max="800" step="1" value={state.everyoneSectionHeight}
               onChange={e=>update({everyoneSectionHeight: parseInt(e.target.value, 10)})}/>
      </label>

      <label style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:13,marginBottom:0,cursor:'pointer'}}>
        <span>Tint logo swirl chocolate</span>
        <input type="checkbox" checked={!!state.accentOnSwirl} onChange={e=>update({accentOnSwirl:e.target.checked})}/>
      </label>
    </div>
  );
}

// Small consumer that re-renders when tweaks change, to drive live updates
function TweakObserver({ children }) {
  const [, force] = useState(0);
  useEffect(() => {
    const h = () => force(x => x + 1);
    window.addEventListener('tweaks-changed', h);
    return () => window.removeEventListener('tweaks-changed', h);
  }, []);
  return children;
}

// apply DOM-side tweak effects (section height, swirl tint)
function applyTweakSideEffects() {
  const t = window.__tweaks || {};
  const inner = document.querySelector('.everyone-inner');
  if (inner) inner.style.height = (t.everyoneSectionHeight || 600) + 'px';
  document.documentElement.style.setProperty('--swirl-tint', t.accentOnSwirl ? 'var(--chocolate)' : 'currentColor');
}
window.addEventListener('tweaks-changed', applyTweakSideEffects);

// Router
function App() {
  const [page, setPage] = useState(() => localStorage.getItem('sf_page') || 'home');
  const [, force] = useState(0);
  const navigate = (p) => {
    setPage(p);
    localStorage.setItem('sf_page', p);
    window.scrollTo({ top: 0, behavior: 'instant' });
  };
  useEffect(() => {
    // reveal on scroll
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) e.target.classList.add('in');
      });
    }, { threshold: 0.1 });
    setTimeout(() => {
      document.querySelectorAll('.reveal').forEach((el) => obs.observe(el));
    }, 50);
    return () => obs.disconnect();
  }, [page]);

  useEffect(() => {
    // apply side effects on initial render
    applyTweakSideEffects();
    const h = () => force(x => x + 1);
    window.addEventListener('tweaks-changed', h);
    return () => window.removeEventListener('tweaks-changed', h);
  }, []);

  return (
    <>
      {page === 'b2b' ? <B2BPage navigate={navigate} /> : <HomePage navigate={navigate} />}
      <TweaksPanel/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
